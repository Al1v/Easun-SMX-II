  # Turn to Mains Voltage - 0xE01B
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set Turn to Mains Voltage"
    address: 0xE01B
    value_type: U_WORD
    multiply: 5
    unit_of_measurement: "V"
    device_class: voltage
    mode: box
    min_value: 18
    max_value: 30
    step: 0.2
    icon: "mdi:transmission-tower"
    entity_category: config

  # Turn to Inverter Voltage - 0xE022
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
