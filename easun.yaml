  # Battery Under Voltage Alarm - 0xE00C (18-28V in 0.2V steps)
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set Battery Under Voltage Alarm"
    address: 0xE00C
    value_type: U_WORD
    multiply: 5
    unit_of_measurement: "V"
    device_class: voltage
    mode: box
    min_value: 18
    max_value: 28
    step: 0.2
    icon: "mdi:battery-alert"
    entity_category: config

  # Battery Over Discharge Voltage - 0xE00D (18-28V in 0.2V steps)
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
