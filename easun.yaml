# ============ WRITABLE SETTINGS (SELECTS) ============
select:
  # Output Priority - 0xE204
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set Output Priority"
    address: 0xE204
    value_type: U_WORD
    optionsmap:
      "Solar First (SOL)": 0
      "Utility First (UTI)": 1
      "SBU Priority": 2
    icon: "mdi:priority-high"
    entity_category: config

  # Charger Priority - 0xE20F
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set Charger Priority"
    address: 0xE20F
    value_type: U_WORD
    optionsmap:
      "Solar First (CSO)": 0
      "Solar & Utility (CUB)": 1
      "Solar Only (SNU)": 2
      "Solar First Alt (OSO)": 3
    icon: "mdi:battery-charging"
    entity_category: config

  # AC Input Voltage Range - 0xE20B
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set AC Input Voltage Range"
    address: 0xE20B
    value_type: U_WORD
    optionsmap:
      "Appliance (APL)": 0
      "UPS": 1
    icon: "mdi:sine-wave"
    entity_category: config

  # Output Frequency - 0xE209
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Set Output Frequency"
    address: 0xE209
    value_type: U_WORD
    optionsmap:
      "50 Hz": 5000
      "60 Hz": 6000
    icon: "mdi:sine-wave"
    entity_category: config

# ============ WRITABLE SETTINGS (SWITCHES) ============
switch:
  # Power Saving Mode - 0xE20C
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
    name: "Power Saving Mode"
    address: 0xE20C
    register_type: holding
    bitmask: 1
    entity_category: config
    icon: "mdi:power-sleep"

  # Restart on Overload - 0xE20D
  - platform: modbus_controller
    modbus_controller_id: "${modbus_id}_ctrl"
